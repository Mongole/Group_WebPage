<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Sobre SC-TECH de Puerto Rico - Nuestra historia, misión y visión.">
	<title>About Us | SC-TECH de Puerto Rico</title>
	<link rel="stylesheet" href="../assets/css/about-us.css">
	<script src="../assets/js/accessibility.js" defer></script>
</head>

<body>

	<!-- Script para validar y cargar modos de accesibilidad antes de que cargue el cuerpo; problema en FireFox -->
	<script>
		(function () {
			var dark = localStorage.getItem('theme_dark');
			var highVis = localStorage.getItem('theme_high_vis');
			var largeText = localStorage.getItem('theme_large_text');
			if (dark === 'true') document.documentElement.classList.add('dark-mode');
			if (highVis === 'true') document.documentElement.classList.add('disable-translucency');
			if (largeText === 'true') document.documentElement.classList.add('large-text');
		})();
	</script>

	<header class="header">
		<nav class="header-nav" aria-label="Navegación principal">
			<a class="brand" href="../index.html">
				<span class="brand-icon">
					<img src="../assets/images/SC-Tech_Logo.png" alt="College Logo" width="40">
				</span>
				<div style="color: #494fdb">SC-TECH<span>DE PUERTO RICO</span></div>
			</a>
			<div class="nav-links">
				<a class="btn-nav-rounded" href="../index.html">Inicio <span aria-hidden="true">↗</span></a>
				<a class="btn-nav-rounded" href="ofertas-academicas.html">Ofertas académicas <span
						aria-hidden="true">↗</span></a>
				<a class="btn-nav-rounded" href="Campus_Map.html">Campus Map <span aria-hidden="true">↗</span></a>
				<a class="btn-nav-rounded active" href="about-us.html">About us <span aria-hidden="true">↗</span></a>

				<!-- Contenedor para botón de accesibilidad -->
				<div class="a11y-dropdown">
					<button type="button" class="btn-a11y" id="a11yToggle" aria-label="Opciones de accesibilidad"
						aria-expanded="false" aria-controls="a11yMenu">
						<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
							<circle cx="12" cy="4" r="2" />
							<path d="M12 8v7M5 9l7 2 7-2M12 15l-4 6M12 15l4 6" />
						</svg>
					</button>

					<div class="a11y-menu" id="a11yMenu" hidden>
						<p class="a11y-menu-title">Accesibilidad</p>
						<label class="a11y-option">
							<span>Modo Oscuro</span>
							<input type="checkbox" id="chkDarkMode">
						</label>
						<label class="a11y-option">
							<span>Alta Visibilidad (Sin Transparencias)</span>
							<input type="checkbox" id="chkHighVisibility">
						</label>
						<label class="a11y-option">
							<span>Texto Ampliado</span>
							<input type="checkbox" id="chkLargeText">
						</label>
					</div>
				</div>
			</div>
		</nav>
	</header>

	<main>
		<!-- Contenido principal para el grupo -->
		<section class="page-content">
			<h1>About Us</h1>
			<p>Espacio reservado para el contenido de Sobre Nosotros...</p>
		</section>
	</main>

	<footer>
		<span>SCTECH de Puerto Rico</span>
		<span>Tu talento. Tu camino. Tu futuro.</span>
		<span>© 2026 SCTECH</span>
	</footer>

</body>

</html>
